<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LED Mask Viewer</title>
  <link rel="stylesheet" href="./vendor/bootstrap/bootstrap.min.css">
  <style>
    :root {
      color-scheme: dark;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111820;
      overflow: hidden;
      font-family: "Roboto", "Segoe UI", Arial, sans-serif;
    }
    .viewer-root {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .viewer-tabs {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px 10px 0;
      border-bottom: 1px solid var(--bs-border-color);
      background: var(--bs-body-bg);
      overflow-x: auto;
      overflow-y: hidden;
      z-index: 6;
    }
    .viewer-tabs-list {
      display: flex;
      flex-wrap: nowrap;
      gap: 2px;
      min-width: 0;
      white-space: nowrap;
      border-bottom: 0;
    }
    .viewer-tabs-list .nav-item {
      flex: 0 0 auto;
    }
    .viewer-tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 240px;
      cursor: pointer;
    }
    .viewer-content {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
    }
    .viewer-zoom {
      position: absolute;
      right: 12px;
      bottom: 10px;
      z-index: 5;
      color: rgba(255, 255, 255, .9);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 8px;
      border-radius: 8px;
      background: rgba(9, 13, 18, .58);
      border: 1px solid rgba(255, 255, 255, .14);
      pointer-events: none;
    }
    .viewer-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #111820;
    }
    .viewer-spec-panel {
      position: absolute;
      inset: 0;
      overflow: auto;
      padding: 14px;
      display: none;
      background: #111820;
      color: rgba(255, 255, 255, .92);
    }
    .viewer-spec-panel.show {
      display: block;
    }
    .viewer-spec-empty {
      color: rgba(255, 255, 255, .72);
      font-size: 13px;
    }
    .viewer-spec-panel .spec-mode-manual-edit,
    .viewer-spec-panel textarea,
    .viewer-spec-panel .EasyMDEContainer,
    .viewer-spec-panel .editor-toolbar,
    .viewer-spec-panel .CodeMirror,
    .viewer-spec-panel .spec-mode-close {
      display: none !important;
    }
    .viewer-spec-panel .spec-mode-markdown,
    .viewer-spec-panel .spec-mode-manual-preview {
      font-size: 13px;
      line-height: 1.5;
    }
    .viewer-spec-panel p,
    .viewer-spec-panel li {
      font-size: 14px;
      line-height: 1.5;
    }
    .viewer-spec-panel ul.viewer-spec-checklist {
      list-style: none;
      padding: 0;
      margin: 0 0 10px;
    }
    .viewer-spec-panel .viewer-spec-check {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 0 0 6px;
      font-size: 14px;
      line-height: 1.45;
    }
    .viewer-spec-panel .viewer-spec-check > input[type="checkbox"] {
      margin-top: 2px;
      width: 16px;
      height: 16px;
      accent-color: #76d6a9;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .viewer-spec-panel .viewer-spec-check > span {
      display: inline-block;
      flex: 1 1 auto;
    }
    .viewer-spec-panel .viewer-custom-checklist {
      margin-top: 14px;
      border-top: 1px dashed rgba(255, 255, 255, .2);
      padding-top: 12px;
    }
    .viewer-spec-panel .viewer-custom-checklist h5 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    .viewer-spec-panel .viewer-custom-add {
      display: flex;
      gap: 8px;
      margin: 8px 0 10px;
    }
    .viewer-spec-panel .viewer-custom-add input[type="text"] {
      flex: 1 1 auto;
      min-width: 0;
      background: rgba(255, 255, 255, .06);
      color: rgba(255, 255, 255, .95);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
    }
    .viewer-spec-panel .viewer-custom-add input[type="text"]::placeholder {
      color: rgba(255, 255, 255, .6);
    }
    .viewer-spec-panel .viewer-custom-action {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      min-width: 34px;
      min-height: 34px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 16px;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
    }
    .viewer-spec-panel .viewer-custom-action-add {
      background: #2563eb;
      border-color: #1d4ed8;
    }
    .viewer-spec-panel .viewer-custom-action-add:hover {
      background: #1d4ed8;
    }
    .viewer-spec-panel .viewer-custom-action-del {
      background: #dc2626;
      border-color: #b91c1c;
    }
    .viewer-spec-panel .viewer-custom-action-del:hover {
      background: #b91c1c;
    }
    .viewer-spec-panel .viewer-custom-delete {
      margin-left: 8px;
      flex: 0 0 auto;
    }
    .viewer-spec-panel h1,
    .viewer-spec-panel h2,
    .viewer-spec-panel h3,
    .viewer-spec-panel h4,
    .viewer-spec-panel h5,
    .viewer-spec-panel h6 {
      margin: 0 0 8px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
    }
    .viewer-spec-panel h1 { font-size: 22px; }
    .viewer-spec-panel h2 { font-size: 20px; }
    .viewer-spec-panel h3 { font-size: 18px; }
    .viewer-spec-panel h4 { font-size: 16px; }
    .viewer-spec-panel h5 { font-size: 20px; }
    .viewer-spec-panel h6 { font-size: 18px; }
    .viewer-spec-panel .spec-mode-block {
      margin: 0 0 10px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 10px;
      background: rgba(255, 255, 255, .03);
    }
    .viewer-spec-panel .spec-mode-block > header {
      padding: 10px 12px;
      font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, .1);
      background: rgba(255, 255, 255, .04);
    }
    .viewer-spec-panel .spec-mode-markdown {
      padding: 10px 12px;
    }
    .viewer-spec-panel .viewer-spec-manual-text {
      padding: 10px 12px;
      border-top: 1px dashed rgba(255, 255, 255, .2);
      white-space: pre-wrap;
      color: rgba(255, 255, 255, .9);
    }
  </style>
</head>
<body>
  <div class="viewer-root">
    <div class="viewer-tabs" data-bs-theme="dark">
      <ul class="viewer-tabs-list nav nav-tabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button id="tabInstall" class="viewer-tab-btn nav-link active" type="button" role="tab" aria-selected="true">Монтажный вид</button>
        </li>
        <li class="nav-item" role="presentation">
          <button id="tabSpec" class="viewer-tab-btn nav-link" type="button" role="tab" aria-selected="false">Спецификация</button>
        </li>
      </ul>
    </div>
    <div class="viewer-content">
      <iframe id="viewerFrame" class="viewer-frame" title="LED project viewer"></iframe>
      <div id="specPanel" class="viewer-spec-panel"></div>
      <div id="zoomLabel" class="viewer-zoom">—</div>
    </div>
  </div>

  <script>
    (() => {
      const frame = document.getElementById("viewerFrame");
      const label = document.getElementById("zoomLabel");
      const tabInstall = document.getElementById("tabInstall");
      const tabSpec = document.getElementById("tabSpec");
      const specPanel = document.getElementById("specPanel");
      let zoomPoll = 0;
      let lastZoomText = "—";
      let activeTab = "install";
      let specRenderVersion = 0;
      let currentSpecStorageKey = "led-mask-viewer.spec-checks.default";
      let currentProjectGuid = "";
      let lastSpecText = "";
      let serverChecklistState = null;
      let checklistWs = null;
      let wsClientId = "";
      let wsReady = false;
      let wsGuid = "";
      let wsUnavailable = false;
      let wsReconnectTimer = 0;
      let wsConnectAttempt = 0;
      const projectStoreApiUrl = "https://static.93.189.179.185.ip.webhost1.net/project_store.php";
      const q = new URLSearchParams(location.search || "");
      const pid = (q.get("projectId") || q.get("projectid") || "").trim();
      const packedProject = (q.get("project") || "").trim();
      const wsUrlFromGlobal = typeof window.LED_MASK_CHECKLIST_WS_URL === "string" ? window.LED_MASK_CHECKLIST_WS_URL.trim() : "";
      const isHttpsPage = String(location.protocol || "").toLowerCase() === "https:";
      const normalizeChecklistWsUrl = input => {
        const raw = String(input || "").trim();
        if (!raw) return "";
        const preferredProto = isHttpsPage ? "wss://" : "ws://";
        let normalized = "";
        if (/^wss?:\/\//i.test(raw)) {
          normalized = isHttpsPage ? raw.replace(/^ws:\/\//i, "wss://") : raw;
        } else if (/^https?:\/\//i.test(raw)) {
          normalized = raw.replace(/^https?:\/\//i, preferredProto);
        } else {
          normalized = `${preferredProto}${raw.replace(/^\/+/, "")}`;
        }
        try {
          const u = new URL(normalized);
          if (u.protocol === "ws:" && !u.port) {
            u.port = "8765";
          }
          if (u.protocol === "wss:" && (!u.pathname || u.pathname === "/")) {
            u.pathname = "/ws-checklist/";
          }
          return u.toString();
        } catch (_e) {
          return normalized;
        }
      };
      const checklistWsUrl = normalizeChecklistWsUrl(
        q.get("checklistWs")
        || q.get("checklistws")
        || wsUrlFromGlobal
        || "static.93.189.179.185.ip.webhost1.net"
      );
      //if (pid) document.title = `LED Mask Viewer #${pid}`;
      const src = new URL("./LEDMaskEditor.html", location.href);
      src.searchParams.set("viewer", "1");
      if (pid) src.searchParams.set("projectid", pid);
      if (packedProject) src.searchParams.set("project", packedProject);
      frame.src = src.toString();

      const hideEditorUi = () => {
        let d = null;
        try { d = frame.contentDocument; } catch (_e) { d = null; }
        if (!d) return;
        let hardCss = d.getElementById("viewerHardHideCss");
        if (!hardCss) {
          hardCss = d.createElement("style");
          hardCss.id = "viewerHardHideCss";
          hardCss.textContent = `
            #projectTabs, #toolbarMain, #toolbarOverflowPopup, #themePopup,
            #sidePanel, .offcanvas-backdrop, #mobileMenu, #installBanner, #saveIndicator, .mobile-dock { display:none !important; }
            .main { position:fixed !important; inset:0 !important; margin:0 !important; padding:0 !important; }
            .app { position:fixed !important; inset:0 !important; margin:0 !important; padding:0 !important; }
            #canvasWrap { position:fixed !important; inset:0 !important; margin:0 !important; padding:0 !important; }
          `;
          d.head.appendChild(hardCss);
        }
        const hide = id => {
          const n = d.getElementById(id);
          if (n) n.style.display = "none";
        };
        const hideAll = selector => {
          for (const n of Array.from(d.querySelectorAll(selector))) {
            n.style.setProperty("display", "none", "important");
          }
        };
        hide("projectTabs");
        hide("toolbarMain");
        hide("toolbarOverflowPopup");
        hide("themePopup");
        hide("sidePanel");
        hide("mobileMenu");
        hide("installBanner");
        hideAll(".mobile-dock");
        const spec = d.getElementById("specModePanel");
        if (spec) spec.style.display = "none";
        const wrap = d.getElementById("canvasWrap");
        if (wrap) {
          wrap.style.position = "fixed";
          wrap.style.inset = "0";
          wrap.style.margin = "0";
        }
        const main = d.querySelector(".main");
        if (main) {
          main.style.position = "fixed";
          main.style.inset = "0";
          main.style.margin = "0";
          main.style.padding = "0";
        }
        const app = d.querySelector(".app");
        if (app) {
          app.style.position = "fixed";
          app.style.inset = "0";
          app.style.margin = "0";
          app.style.padding = "0";
        }
      };

      const forceViewerMode = () => {
        let d = null;
        try { d = frame.contentDocument; } catch (_e) { d = null; }
        if (!d) return;
        const clickById = id => {
          const n = d.getElementById(id);
          if (n) n.click();
        };
        const forceSelectMode = () => {
          try {
            const ev = new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true });
            d.dispatchEvent(ev);
          } catch (_e) { }
        };
        const lockBtn = d.getElementById("lockAllToggle");
        if (lockBtn && lockBtn.getAttribute("aria-pressed") !== "true") lockBtn.click();
        if (activeTab === "install") clickById("viewModeInstall");
        forceSelectMode();
      };
      const escapeHtml = s => String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
      const renderInlineMd = value => {
        const escaped = escapeHtml(value);
        const linked = escaped.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_m, text, href) => `<a href="${href}" target="_blank" rel="noopener noreferrer">${text}</a>`);
        return linked.replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g, (_m, lead, href) => `${lead}<a href="${href}" target="_blank" rel="noopener noreferrer">${href}</a>`);
      };
      const hashKey = value => {
        const s = String(value || "");
        let h = 2166136261 >>> 0;
        for (let i = 0; i < s.length; i++) {
          h ^= s.charCodeAt(i);
          h = Math.imul(h, 16777619) >>> 0;
        }
        return h.toString(36);
      };
      const normalizeChecklistState = raw => {
        const src = raw && typeof raw === "object" ? raw : {};
        const checks = {};
        const customItems = [];
        const applyChecksMap = map => {
          if (!map || typeof map !== "object") return;
          for (const [k, v] of Object.entries(map)) {
            const key = String(k || "").trim();
            if (!key || key === "checks" || key === "customItems" || key === "__checks" || key === "__customItems") continue;
            checks[key] = !!v;
          }
        };
        if (src.__checks && typeof src.__checks === "object") {
          const rawChecks = src.__checks;
          // Migration: broken payload could contain nested `checks` map under __checks.
          if (rawChecks.checks && typeof rawChecks.checks === "object") applyChecksMap(rawChecks.checks);
          applyChecksMap(rawChecks);
        } else {
          // Legacy flat format or transitional { checks, customItems } shape.
          if (src.checks && typeof src.checks === "object") applyChecksMap(src.checks);
          for (const [k, v] of Object.entries(src)) {
            if (k === "__customItems" || k === "__checks" || k === "checks" || k === "customItems") continue;
            const key = String(k || "").trim();
            if (!key) continue;
            checks[key] = !!v;
          }
        }
        const items = Array.isArray(src.__customItems)
          ? src.__customItems
          : (Array.isArray(src.customItems) ? src.customItems : []);
        for (const it of items) {
          const id = String(it && it.id || "").trim();
          const text = String(it && it.text || "").trim();
          if (!id || !text) continue;
          customItems.push({ id, text });
        }
        return { checks, customItems };
      };
      const serializeChecklistState = state => {
        const model = normalizeChecklistState(state);
        return {
          __checks: { ...model.checks },
          __customItems: model.customItems.map(it => ({ id: it.id, text: it.text }))
        };
      };
      const readChecklistStateFromLocalStorage = () => {
        try {
          const raw = localStorage.getItem(currentSpecStorageKey) || "{}";
          const parsed = JSON.parse(raw);
          return normalizeChecklistState(parsed);
        } catch (_e) {
          return { checks: {}, customItems: [] };
        }
      };
      const mergeChecklistStates = (baseState, overlayState) => {
        const base = normalizeChecklistState(baseState);
        const overlay = normalizeChecklistState(overlayState);
        const checks = { ...base.checks, ...overlay.checks };
        const byId = new Map();
        for (const it of base.customItems) byId.set(String(it.id), { id: String(it.id), text: String(it.text) });
        for (const it of overlay.customItems) byId.set(String(it.id), { id: String(it.id), text: String(it.text) });
        return { checks, customItems: [...byId.values()] };
      };
      const isChecklistStateEmpty = state => {
        const model = normalizeChecklistState(state);
        return !Object.keys(model.checks).length && !(Array.isArray(model.customItems) && model.customItems.length);
      };
      const loadChecklistState = () => {
        const local = readChecklistStateFromLocalStorage();
        if (currentProjectGuid && serverChecklistState && typeof serverChecklistState === "object") {
          return normalizeChecklistState(serverChecklistState);
        }
        return local;
      };
      const saveChecklistState = state => {
        const model = normalizeChecklistState(state);
        const serial = serializeChecklistState(model);
        if (currentProjectGuid) {
          serverChecklistState = serial;
        }
        try {
          localStorage.setItem(currentSpecStorageKey, JSON.stringify(serial));
        } catch (_e) { }
      };
      const applyChecklistStateToDom = state => {
        if (!specPanel || !state || typeof state !== "object") return;
        const model = normalizeChecklistState(state);
        const checks = model.checks || {};
        for (const input of Array.from(specPanel.querySelectorAll("input[type='checkbox'][data-check-key]"))) {
          const key = String(input.getAttribute("data-check-key") || "").trim();
          if (!key) continue;
          input.checked = !!checks[key];
        }
      };
      const closeChecklistWs = () => {
        wsReady = false;
        wsGuid = "";
        if (wsReconnectTimer) {
          window.clearTimeout(wsReconnectTimer);
          wsReconnectTimer = 0;
        }
        if (checklistWs) {
          if (currentProjectGuid && checklistWs.readyState === WebSocket.OPEN) {
            try {
              checklistWs.send(JSON.stringify({
                type: "unsubscribe",
                checklistGuid: currentProjectGuid,
                clientId: wsClientId
              }));
            } catch (_e) { }
          }
          try { checklistWs.close(); } catch (_e) { }
          checklistWs = null;
        }
      };
      const scheduleWsReconnect = () => {
        if (wsReconnectTimer || !currentProjectGuid) return;
        const delay = Math.min(8000, 500 * (2 ** Math.min(wsConnectAttempt, 4)));
        wsReconnectTimer = window.setTimeout(() => {
          wsReconnectTimer = 0;
          connectChecklistWs();
        }, delay);
      };
      const sendWsMessage = msg => {
        if (!checklistWs || checklistWs.readyState !== WebSocket.OPEN) return false;
        try {
          checklistWs.send(JSON.stringify(msg));
          return true;
        } catch (_e) {
          return false;
        }
      };
      const connectChecklistWs = () => {
        if (!currentProjectGuid || !checklistWsUrl || typeof WebSocket !== "function") {
          wsUnavailable = true;
          return;
        }
        if (checklistWs && wsGuid === currentProjectGuid) {
          if (checklistWs.readyState === WebSocket.CONNECTING || checklistWs.readyState === WebSocket.OPEN) {
            return;
          }
        }
        closeChecklistWs();
        wsConnectAttempt += 1;
        try {
          checklistWs = new WebSocket(checklistWsUrl);
          wsGuid = currentProjectGuid;
        } catch (_e) {
          wsUnavailable = true;
          return;
        }
        checklistWs.addEventListener("open", () => {
          wsReady = true;
          wsUnavailable = false;
          wsConnectAttempt = 0;
          sendWsMessage({
            type: "subscribe",
            checklistGuid: currentProjectGuid,
            clientId: wsClientId
          });
        });
        checklistWs.addEventListener("message", e => {
          let msg = null;
          try { msg = JSON.parse(String(e.data || "")); } catch (_e) { msg = null; }
          const msgGuid = String((msg && (msg.checklistGuid || msg.checklist_guid)) || "").trim();
          if (!msg || typeof msg !== "object" || msgGuid !== currentProjectGuid) return;
          if (msg.type === "init_state") {
            const incoming = normalizeChecklistState(msg.state);
            saveChecklistState(incoming);
            applyChecklistStateToDom(incoming);
            return;
          }
          if (msg.type === "state_replace") {
            const incoming = normalizeChecklistState(msg.state);
            saveChecklistState(incoming);
            if (activeTab === "spec") {
              specPanel.innerHTML = markdownToHtml(lastSpecText);
            } else {
              applyChecklistStateToDom(incoming);
            }
            return;
          }
          if (msg.type === "checkbox_update") {
            const key = String(msg.key || "").trim();
            if (!key) return;
            const state = loadChecklistState();
            state.checks[key] = !!msg.checked;
            saveChecklistState(state);
            applyChecklistStateToDom(state);
          }
        });
        checklistWs.addEventListener("close", () => {
          wsReady = false;
          checklistWs = null;
          wsUnavailable = true;
          scheduleWsReconnect();
        });
        checklistWs.addEventListener("error", () => {
          wsReady = false;
          wsUnavailable = true;
        });
      };
      const pushCheckboxUpdateToWs = (key, checked) => {
        if (!wsReady || !currentProjectGuid || !key) return false;
        return sendWsMessage({
          type: "checkbox_update",
          checklistGuid: currentProjectGuid,
          checklist_guid: currentProjectGuid,
          key,
          checked: !!checked,
          clientId: wsClientId
        });
      };
      const pushChecklistStateToWs = state => {
        if (!wsReady || !currentProjectGuid) return false;
        return sendWsMessage({
          type: "state_replace",
          checklistGuid: currentProjectGuid,
          checklist_guid: currentProjectGuid,
          state: serializeChecklistState(state),
          clientId: wsClientId
        });
      };
      const loadChecklistStateFromServer = async guid => {
        const g = String(guid || "").trim();
        if (!g) return null;
        try {
          const u = new URL(projectStoreApiUrl);
          u.searchParams.set("checklist_guid", g);
          const res = await fetch(u.toString(), { method: "GET" });
          if (!res.ok) return null;
          const json = await res.json();
          if (!json || json.ok !== true || !json.checklist) return null;
          const raw = String(json.checklist.checklist_json || "{}");
          const parsed = JSON.parse(raw);
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch (_e) {
          return null;
        }
      };
      const saveChecklistStateToServer = async (guid, state) => {
        const g = String(guid || "").trim();
        if (!g) return false;
        try {
          const res = await fetch(projectStoreApiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              checklistGuid: g,
              checklistData: state && typeof state === "object" ? state : {}
            })
          });
          if (!res.ok) return false;
          const json = await res.json();
          return !!(json && json.ok === true);
        } catch (_e) {
          return false;
        }
      };
      const resolveSpecStorageKey = () => {
        try {
          const w = frame.contentWindow;
          const guid = w && typeof w.ledMaskGetProjectGuid === "function" ? String(w.ledMaskGetProjectGuid() || "").trim() : "";
          const fallback = String(pid || "").trim() || "default";
          return `led-mask-viewer.spec-checks.${guid || fallback}`;
        } catch (_e) {
          const fallback = String(pid || "").trim() || "default";
          return `led-mask-viewer.spec-checks.${fallback}`;
        }
      };
      const markdownToHtml = text => {
        const src = String(text || "").replace(/\r/g, "");
        if (!src.trim()) return `<div class="viewer-spec-empty">Нет данных для спецификации</div>`;
        const lines = src.split("\n");
        const out = [];
        const model = loadChecklistState();
        const checks = model.checks || {};
        let listOpen = false;
        let headingTrail = ["spec"];
        const closeList = () => {
          if (!listOpen) return;
          out.push("</ul>");
          listOpen = false;
        };
        for (const raw of lines) {
          const line = String(raw || "");
          const heading = line.match(/^(#{1,6})\s+(.+)\s*$/);
          if (heading) {
            closeList();
            const lvl = Math.max(1, Math.min(6, heading[1].length));
            headingTrail = headingTrail.slice(0, Math.max(1, lvl - 1));
            headingTrail[lvl - 1] = String(heading[2] || "").trim();
            out.push(`<h${lvl}>${renderInlineMd(heading[2])}</h${lvl}>`);
            continue;
          }
          const bullet = line.match(/^\s*[-*]\s+(.+)\s*$/);
          if (bullet) {
            if (!listOpen) {
              out.push('<ul class="viewer-spec-checklist">');
              listOpen = true;
            }
            const textPart = String(bullet[1] || "").trim();
            const keyRaw = `${headingTrail.join(" > ")}|${textPart}`;
            const key = hashKey(keyRaw);
            const checked = !!checks[key];
            out.push(
              `<li><label class="viewer-spec-check">`
              + `<input type="checkbox" data-check-key="${escapeHtml(key)}"${checked ? " checked" : ""}>`
              + `<span>${renderInlineMd(textPart)}</span>`
              + `</label></li>`
            );
            continue;
          }
          if (!line.trim()) {
            closeList();
            continue;
          }
          closeList();
          out.push(`<p>${renderInlineMd(line.trim())}</p>`);
        }
        closeList();
        out.push('<section class="viewer-custom-checklist">');
        out.push("<h5>Дополнительно</h5>");
        out.push('<form class="viewer-custom-add" data-custom-add-form>');
        out.push('<input type="text" data-custom-add-input placeholder="Добавить пункт чек-листа">');
        out.push('<button type="submit" class="viewer-custom-action viewer-custom-action-add" data-custom-add-btn title="Добавить пункт" aria-label="Добавить пункт">+</button>');
        out.push("</form>");
        out.push('<ul class="viewer-spec-checklist">');
        for (const item of (Array.isArray(model.customItems) ? model.customItems : [])) {
          const id = String(item && item.id || "").trim();
          const textPart = String(item && item.text || "").trim();
          if (!id || !textPart) continue;
          const key = `custom:${id}`;
          const checked = !!checks[key];
          out.push(
            `<li><label class="viewer-spec-check">`
            + `<input type="checkbox" data-check-key="${escapeHtml(key)}"${checked ? " checked" : ""}>`
            + `<span>${renderInlineMd(textPart)}</span>`
            + `<button type="button" class="viewer-custom-action viewer-custom-action-del viewer-custom-delete" data-custom-delete-id="${escapeHtml(id)}" title="Удалить пункт" aria-label="Удалить пункт">×</button>`
            + `</label></li>`
          );
        }
        out.push("</ul>");
        out.push("</section>");
        return out.join("");
      };
      const renderSpecFlatHtml = async () => {
        const myVersion = ++specRenderVersion;
        if (!specPanel) return;
        let w = null;
        try { w = frame.contentWindow; } catch (_e) { w = null; }
        if (!w || typeof w.ledMaskBuildFlatSpecText !== "function") {
          specPanel.innerHTML = `<div class="viewer-spec-empty">Спецификация недоступна</div>`;
          return;
        }
        let text = "";
        currentSpecStorageKey = resolveSpecStorageKey();
        try {
          const wGuid = w && typeof w.ledMaskGetProjectGuid === "function" ? String(w.ledMaskGetProjectGuid() || "").trim() : "";
          currentProjectGuid = wGuid;
        } catch (_e) {
          currentProjectGuid = "";
        }
        if (currentProjectGuid) {
          wsUnavailable = false;
          connectChecklistWs();
          if (!wsReady) {
            const fromServer = await loadChecklistStateFromServer(currentProjectGuid);
            if (fromServer && typeof fromServer === "object") {
              const local = readChecklistStateFromLocalStorage();
              serverChecklistState = serializeChecklistState(fromServer);
              try { localStorage.setItem(currentSpecStorageKey, JSON.stringify(serializeChecklistState(fromServer))); } catch (_e) { }
              if (isChecklistStateEmpty(fromServer) && !isChecklistStateEmpty(local)) {
                saveChecklistStateToServer(currentProjectGuid, serializeChecklistState(local));
                serverChecklistState = serializeChecklistState(local);
                try { localStorage.setItem(currentSpecStorageKey, JSON.stringify(serializeChecklistState(local))); } catch (_e) { }
              }
            } else {
              serverChecklistState = null;
            }
          }
        }
        try {
          text = await Promise.resolve(w.ledMaskBuildFlatSpecText());
        } catch (_e) {
          text = "";
        }
        lastSpecText = String(text || "");
        if (myVersion !== specRenderVersion) return;
        if (!String(text || "").trim()) {
          specPanel.innerHTML = `<div class="viewer-spec-empty">Нет данных для спецификации</div>`;
          return;
        }
        specPanel.innerHTML = markdownToHtml(text);
      };
      const persistChecklistModel = state => {
        saveChecklistState(state);
        pushChecklistStateToWs(state);
        if (currentProjectGuid) {
          saveChecklistStateToServer(currentProjectGuid, serializeChecklistState(state));
        }
      };
      const addCustomChecklistItem = inputNode => {
        const value = String(inputNode && inputNode.value || "").trim();
        if (!value) return false;
        const state = loadChecklistState();
        if (!Array.isArray(state.customItems)) state.customItems = [];
        const id = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
        state.customItems.push({ id, text: value });
        state.checks[`custom:${id}`] = false;
        persistChecklistModel(state);
        if (inputNode) inputNode.value = "";
        specPanel.innerHTML = markdownToHtml(lastSpecText);
        return true;
      };
      specPanel.addEventListener("change", e => {
        const input = e.target && e.target.closest ? e.target.closest("input[type='checkbox'][data-check-key]") : null;
        if (!input) return;
        const key = String(input.getAttribute("data-check-key") || "").trim();
        if (!key) return;
        const state = loadChecklistState();
        state.checks[key] = !!input.checked;
        saveChecklistState(state);
        const pushedToWs = pushCheckboxUpdateToWs(key, !!input.checked);
        if (currentProjectGuid && (!pushedToWs || wsUnavailable)) {
          saveChecklistStateToServer(currentProjectGuid, serializeChecklistState(state));
        }
      });
      specPanel.addEventListener("submit", e => {
        const form = e.target && e.target.closest ? e.target.closest("form[data-custom-add-form]") : null;
        if (!form) return;
        e.preventDefault();
        const input = form.querySelector("input[data-custom-add-input]");
        addCustomChecklistItem(input);
      });
      specPanel.addEventListener("click", e => {
        const addBtn = e.target && e.target.closest ? e.target.closest("button[data-custom-add-btn]") : null;
        if (addBtn) {
          e.preventDefault();
          const form = addBtn.closest("form[data-custom-add-form]");
          const input = form ? form.querySelector("input[data-custom-add-input]") : null;
          addCustomChecklistItem(input);
          return;
        }
        const btn = e.target && e.target.closest ? e.target.closest("button[data-custom-delete-id]") : null;
        if (!btn) return;
        e.preventDefault();
        const id = String(btn.getAttribute("data-custom-delete-id") || "").trim();
        if (!id) return;
        const state = loadChecklistState();
        state.customItems = (Array.isArray(state.customItems) ? state.customItems : []).filter(it => String(it && it.id || "") !== id);
        try { delete state.checks[`custom:${id}`]; } catch (_e) { state.checks[`custom:${id}`] = false; }
        persistChecklistModel(state);
        specPanel.innerHTML = markdownToHtml(lastSpecText);
      });
      const switchTab = next => {
        activeTab = next === "spec" ? "spec" : "install";
        const install = activeTab === "install";
        tabInstall.classList.toggle("active", install);
        tabSpec.classList.toggle("active", !install);
        tabInstall.setAttribute("aria-selected", install ? "true" : "false");
        tabSpec.setAttribute("aria-selected", install ? "false" : "true");
        specPanel.classList.toggle("show", !install);
        frame.style.display = install ? "block" : "none";
        label.style.display = install ? "block" : "none";
        let d = null;
        try { d = frame.contentDocument; } catch (_e) { d = null; }
        if (d) {
          const clickById = id => {
            const n = d.getElementById(id);
            if (n) n.click();
          };
          if (install) {
            clickById("viewModeInstall");
          } else {
            renderSpecFlatHtml();
            window.setTimeout(renderSpecFlatHtml, 140);
            window.setTimeout(renderSpecFlatHtml, 420);
          }
        } else if (!install) {
          specPanel.innerHTML = `<div class="viewer-spec-empty">Загрузка спецификации...</div>`;
        }
      };
      tabInstall.addEventListener("click", () => switchTab("install"));
      tabSpec.addEventListener("click", () => switchTab("spec"));

      const updateZoomLabel = () => {
        try {
          const d = frame.contentDocument;
          const z = d && d.getElementById("zoomLabel");
          const raw = z ? String(z.textContent || "").trim() : "";
          if (raw) lastZoomText = raw;
          label.textContent = lastZoomText;
          const pn = d && d.getElementById("projectName");
          const name = pn ? String(pn.value || "").trim() : "";
          if (name != "project") document.title = name;
        } catch (_e) { }
      };

      frame.addEventListener("load", () => {
        wsClientId = `viewer-${Math.random().toString(36).slice(2, 10)}-${Date.now().toString(36)}`;
        if (zoomPoll) window.clearInterval(zoomPoll);
        const boot = () => {
          hideEditorUi();
          forceViewerMode();
          updateZoomLabel();
          if (activeTab === "spec") renderSpecFlatHtml();
        };
        boot();
        window.setTimeout(boot, 150);
        window.setTimeout(boot, 600);
        zoomPoll = window.setInterval(updateZoomLabel, 250);
      });
      window.addEventListener("beforeunload", () => {
        closeChecklistWs();
      });
      window.addEventListener("pagehide", () => {
        closeChecklistWs();
      });
    })();
  </script>
</body>
</html>

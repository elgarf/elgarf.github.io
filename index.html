<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Инструменты</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --button: #238636;
      --button-hover: #2ea043;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(35, 134, 54, 0.15), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(56, 139, 253, 0.12), transparent 40%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .menu {
      width: min(92vw, 640px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.7rem;
      font-weight: 700;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .tool-link {
      display: inline-block;
      padding: 14px 20px;
      border-radius: 12px;
      background: var(--button);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .tool-link:hover,
    .tool-link:focus-visible {
      background: var(--button-hover);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="menu">
    <h1>Меню инструментов</h1>
    <p>Выберите инструмент для работы</p>
    <a class="tool-link" href="tools/LEDMaskEditor.html">Редактор масок для LED экранов</a>
  </main>
</body>
</html>
